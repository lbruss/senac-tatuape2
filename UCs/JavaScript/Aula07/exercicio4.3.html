<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Produtos sinistros</title>
</head>
<body>
	<h1>Exercício 4.3</h1>
	<p id="normal">Produtos: </p>
	<p id="dprodutos">Dois produto no final: </p>

	<script>
        /*
        Exercício 3
        Crie um vetor contendo os nomes de quatro produtos. Utilize o método push() para adicionar mais dois
        produtos ao final do vetor e exiba o conteúdo atualizado.
        */

		var produtos = ['Notebook',' Celular',' TV',' Playstation 4'];

		document.getElementById('normal').innerHTML += produtos;

		produtos.push(' Roupas',' Sabão');

		document.getElementById('dprodutos').innerHTML += produtos;
		
	</script>

</body>
</html>
