<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>10 até 1</title>
</head>
<body>
	<h1>Exercício 1.3</h1>
	<p id="repetir"></p>

	<script type="text/javascript">
        /*
        Exercício 3
        Utilize o do...while para exibir os números de 10 até 1 em ordem decrescente
        */
		var cont = 1;
		var num = 11;
        var nan = '';

		do{
			nan += num - cont + '<br>';
			cont++;
		} while (cont <= 10);

		document.getElementById('repetir').innerHTML = nan;
	</script>

</body>
</html>
