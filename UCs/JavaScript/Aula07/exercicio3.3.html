<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Disciplinas - Lista</title>
</head>
<body>
	<h1>Exercício 3.3</h1>
	<p id="disciplinas"></p>

	<script>
        /*
        Exercício 3
        Crie um vetor com cinco disciplinas escolares e utilize um laço for para percorrer todos os elementos.
        Monte uma lista HTML () exibindo cada disciplina em um item da lista ().
        */

		var disciplinas, resultado, fim, cont;

		disciplinas = ['Matemática', 'Física', 'Química', 'Biologia', 'Artes'];
		final = disciplinas.length;

		resultado = '<ul>';
			for(cont = 0; cont < final; cont++){
				resultado += '<li>' + disciplinas[cont] + '</li>';
			}
			resultado += '</ul>';
			document.getElementById('disciplinas').innerHTML = resultado;
	</script>
</body>
</html>
