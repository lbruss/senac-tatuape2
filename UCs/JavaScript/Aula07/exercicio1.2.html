<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>1 a 20</title>
</head>
<body>
	<h1>Exercício 1.2</h1>
	<p id="repetir"></p>

	<script type="text/javascript">
        /*
        Exercício 2
        Crie um algoritmo com while que exiba todos os números de 1 a 20 em ordem crescente
        */
		var cont = 1;
		var num = '';

		while(cont <= 20){
			num += + cont + '<br>';
			cont++;
        document.getElementById('repetir').innerHTML = num;
		}
	</script>

</body>
</html>
