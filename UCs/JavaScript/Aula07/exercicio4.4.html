<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nome alunos e professores</title>
</head>
<body>
	<h1>Exercício 4.4</h1>
	<p id="nomesAP">Nomes dos alunos e professores: </p>
 	<p id="alunoN">Nomes dos alunos e professores (um novo aluno no início): </p>
	<p id="professorN">Nomes dos alunos e professores (um novo professor no final): </p>


	<script>
        /*
        Exercício 4
        Elabore um programa que crie dois vetores: um contendo nomes de alunos e outro contendo nomes
        de professores. Utilize concat() para uni-los em um único vetor. Depois, adicione um novo nome no 
        início usando unshift() e outro no final usando push(). Exiba o vetor resultante.
        */

		var alunos = ['Eduardo',' Enzo',' Daniel'];
		var professores = ['Sirlene',' José',' Vinicius'];

		var resultado = alunos.concat(professores);
		document.getElementById('nomesAP').innerHTML += resultado;

        resultado.unshift('Bruss');
		document.getElementById('alunoN').innerHTML += resultado;

		resultado.push(' Leandro');
		document.getElementById('professorN').innerHTML += resultado;
	</script>
</body>
</html>
