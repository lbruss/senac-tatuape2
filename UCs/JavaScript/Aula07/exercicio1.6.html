<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada com laço de repetição aninhados</title>
</head>
<body>
    <h1>Exercício 1.6</h1>
    <script>
        /*
        Exercício 6
        Elabore um algoritmo que exiba as tabuadas de 1 a 10 utilizando laços de repetição aninhados.
        */
    for(var i = 1; i < 11; i++){
    document.write("<p>Tabuada do " + i + "</p>");

    for(var j = 1; j < 11; j++){
        document.write(i + " x " + j + " = " + (i * j) + "<br>");
    }
    }
    </script>
</body>
</html>
