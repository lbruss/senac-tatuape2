<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Somar 10 números inteiros</title>
</head>
<body>
	<h1>Exercício 2.1</h1>
	<p id="soma">A soma de todos os números inteiros é: </p>

	<script>
        /*
        Exercício 1
        Crie um programa que solicite ao usuário 10 números inteiros. Utilize uma variável acumuladora para
        calcular a soma de todos os valores digitados e exiba o resultado ao final
        */
		var cont = 1;
		var total = 0;
		var numero = 0;

		alert('Digite 10 números aleatórios');

		for(cont = 1; cont <= 10; cont++){
			numero = parseInt(prompt('Digite o '+ cont + 'º número', ''));
			total = total + numero;
		}

		document.getElementById('soma').innerHTML += total;
	</script>
</body>
</html>
