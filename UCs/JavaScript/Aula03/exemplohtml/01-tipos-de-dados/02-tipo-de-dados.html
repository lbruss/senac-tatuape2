<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tipo de dados</title>
</head>
<body>
	<h1>Tipo de dados</h1>
	<p id="teste1">O valor de a é: </p>
	<p id="teste2">O valor de b é: </p>
	<p id="teste3">O valor de c é: </p>
	<p id="teste4">O valor de d é: </p>
	<p id="teste5">O valor de e é: </p>
	<p id="teste6">O valor de f é: </p>
	<p id="teste7">O valor de g é: </p>

	<script>
		//Definindo as variáveis
		var a; //Variável a sem nenhuma definição de tipo de valor
		var b = 1; //Variável b do tipo inteiro com valor 1
		var c = [1,2,3,4,5]; //Variável do tipo array com valores 1, 2, 3, 4 e 5
		var d = ['Verde','Amarelo','Azul','Branco']; //Variável do tipo array, com dados do tipo texto
		var e = 'JavaScript'; //Variável do tipo String ou texto
		var f = false; //Variável do tipo booleana - variável lógica
		var g = null; //Variável sem definição, com valor nulo

		//Exibindo o conteúdo de cada variável
		document.getElementById("teste1").innerHTML+=a;
		document.getElementById("teste2").innerHTML+=b;
		document.getElementById("teste3").innerHTML+=c[2]; //Representa a segunda posição do vetor
		document.getElementById("teste4").innerHTML+=d;
		document.getElementById("teste5").innerHTML+=e;
		document.getElementById("teste6").innerHTML+=f;
		document.getElementById("teste7").innerHTML+=g;		
	</script>
</body>
</html>
