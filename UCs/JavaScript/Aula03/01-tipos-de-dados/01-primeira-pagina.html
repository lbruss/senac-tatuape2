<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Primeira página em JavaScript</title>
</head>
<body>
	<h1>Primeira página em JavaScript</h1>
	<p id="texto"></p>
	<script>
		//Comentarios na linha
		/* Isto é um comentario
		que contém várias linhas
		de informações
		*/
		document.write('Meu primeiro texto em JavaScrip');//Usando o método document.write()
		document.getElementById('texto').innerHTML='Segundo texto em JavaScript';
		/*
		O obejtivo desse método é obter um elemento que tenha um id
		com o nome texto e atribuitr a esse elemento a frase que está
		logo após a propiedade innerHTML
		*/
	</script>
</body>
</html>
