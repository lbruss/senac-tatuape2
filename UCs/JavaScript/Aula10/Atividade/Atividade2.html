<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo de DOM - Atividade</title>
</head>
<body>
	<h1>Atividade onmousedown e onmouseup</h1>
	<img src="carro1.jpg" alt="Carro"
	title="Carro bom" id="carro"
	onmousedown="Carro1()" onmouseup="Carro2()">
	<p>Clique no carro e mantenha o mouse pressionado</p>

	<script>
	function Carro1(){
		document.getElementById('carro').src='carro1.jpg';
	}
	function Carro2(){
		document.getElementById('carro').src='carro2.jpg';
	}
	</script>
</body>
</html>
