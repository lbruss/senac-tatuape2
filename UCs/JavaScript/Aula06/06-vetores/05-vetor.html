<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo de vetor</title>
</head>
<body>
	<h1>Exemplo de vetor</h1>
	<h3>Adiciona um ou mais elementos no início de um vetor</h3>
	<p id="teste1">Vetor sem unshift: </p>
	<p id="teste2">Vetor com unshift: </p>

	<script>
		//Como adicionar elementos no ínicio de um array usando o método unshift()
		//Criando a variável vetor
		var vetor = [2,3,4,5,6];
		//O array começa com os números 2,3,4,5,6

		//Mostrar o vetor no ID chamado 'teste1'
		document.getElementById('teste1').innerHTML += vetor;
		//Vai exibir o conteúdo do vetor

		//Adicionando elementos no início do vetor
		vetor.unshift(0,1);
		//Aqui os números 0 a 1 são inseridos no começo do array

		/*
		Mostrar novamente o vetor, agora com os elementos
		adicionando no início
		*/
		document.getElementById('teste2').innerHTML += vetor;
	</script>

</body>
</html>
