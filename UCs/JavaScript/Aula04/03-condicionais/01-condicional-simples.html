<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Estrutura condicional simples</title>
</head>
<body>
	<h1>Estrutura condicional simples</h1>
	<p id="teste"></p>

	<script>
		//Criando a variável 
		media = 7;

		//Criando a condicinal simple
		if (media >= 7){
			resposta = 'Aprovado(a)';
		} //if = se - then = então - else = senão

		//Mostrar o resultado 
		document.getElementById('teste').innerHTML = resposta;
	</script>

</body>
</html>
