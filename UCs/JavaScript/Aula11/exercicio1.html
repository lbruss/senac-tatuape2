<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exercício 1</title>
</head>
<body>
	<h1>Mensagem de Boas-Vindas</h1>
	<p id="atv1"></p>

	<button type="button" onclick="exibirmensagem();">Exibir Mensagem</button>

	<script>
	function exibirmensagem(){
		var texto = 'Bem-vindo ao estudo de JavaScript!';
		document.getElementById('atv1').innerHTML=texto;
	}
	</script>
</body>
</html>
