<!DOCTYPE html>
<html lang="pt-br">
<head>

	<title>Exercício 2</title>
</head>
<body>
	<h1>Calcular média</h1>
	<p id="media">Média é: </p>

	<script>

    function calcularMedia(nota1, nota2){
    return (nota1+nota2)/2;
    }

    var nota1=8,nota2=6;

    document.getElementById('media').innerHTML += calcularMedia(nota1,nota2);
    </script>
</body>
