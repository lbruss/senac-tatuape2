<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exercício 5</title>
</head>
<body>
	<h1>Calculadora</h1>
	<p id="soma">A soma dos números é: </p>
	<p id="sub">A subtração dos números é: </p>
	<p id="mult">A multiplicação dos números é: </p>
	<p id="div">A divisão dos números é: </p>

	<button type="button" onclick="document.getElementById('soma').innerHTML += Soma(num1, num2);">Soma</button>
	<button type="button" onclick="document.getElementById('sub').innerHTML += Sub(num1, num2);">Subtração</button>
	<button type="button" onclick="document.getElementById('mult').innerHTML += Mult(num1, num2);">Multiplicação</button>
	<button type="button" onclick="document.getElementById('div').innerHTML += Div(num1, num2);">Divisão</button>

	<script>
    function Soma(a,b){
        return a + b;
    }

    function Sub(a,b){
        return a - b;
    }

    function Mult(a,b){
        return a * b;
    }

    function Div(a,b){
        return a / b;
    }

    var num1=0, num2=0;

    num1=parseInt(prompt('Digite o 1º número',''));
    num2=parseInt(prompt('Digite o 2º número',''));
    </script>
</body>
</html>
