<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Laço de repetição FOR</title>
</head>
<body>
	<h1>Laço de repetição FOR</h1>
	<p id="tabuada"></p>

	<script type="text/javascript">
		//Criando as variáveis
		var num = 5; //Número da tabuada
		var cont = 1; //contador do loop
		var resposta = ''; //String que vai armazenar o resultado

		//Criando a tabuada
		for(cont = 1; cont <= 10; cont++){
			//Esse laço for repete de 1 até 10
			resposta += num + 'x' + cont + ' = ' + num * cont + '<br>';
			//Em cada repetição, é calculado  num * e adiciona à variável resposta
			/*
			5 x 1 = 5
			5 x 2 = 10
			...
			5 x 10 = 50
			*/
			//Mostrar o resultado da tabuada
			document.getElementById('tabuada').innerHTML = resposta;
			//Insere todo o conteúdo da variável resposta dentro do elemento HTML que tiver o id='tabuada'
		}
	</script>

</body>
</html>
