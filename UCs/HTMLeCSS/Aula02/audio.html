<!DOCTYPE html>
<html>
    <head>
        <title>Áudio</title>
    </head>

    <body>
        <audio controls>
            <source src="recursos/horse.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento audio.
            <!-- <audio controls> Cria um player de áudio na página-->
            <!-- o atributo controls, faz aparecer os botões de play, pause, volume
             barra de progresso etc-->
             <!-- <source> indica o caminho do arquivo de áudio a ser reproduzido
              type="audio/mpeg" especifica o formato do arquivo mp3-->
        </audio>
    </body>
</html>
